<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>SAM3 Annotator — Login</title>
<style>
  :root {
    --bg: #0e1117;
    --surface: #161b22;
    --border: #2d333b;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-hover: #79c0ff;
    --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .login-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 40px;
    width: 360px;
    text-align: center;
  }
  .login-box h1 {
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--accent);
    margin-bottom: 8px;
  }
  .login-box p {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 24px;
  }
  input[type="password"] {
    width: 100%;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    font-family: inherit;
    font-size: 14px;
    margin-bottom: 16px;
    text-align: center;
    letter-spacing: 3px;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 4px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  .error {
    color: var(--red);
    font-size: 12px;
    margin-top: 12px;
    display: none;
  }
</style>
</head>
<body>
<div class="login-box">
  <h1>SAM3 ANNOTATOR</h1>
  <p>Enter password to continue</p>
  <input type="password" id="pw" placeholder="••••••••" autofocus
         onkeydown="if(event.key==='Enter')doLogin()" />
  <button onclick="doLogin()">Login</button>
  <div class="error" id="err">Incorrect password</div>
</div>
<script>
async function doLogin() {
  const pw = document.getElementById('pw').value;
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: pw }),
  });
  if (res.ok) {
    window.location.href = '/';
  } else {
    document.getElementById('err').style.display = 'block';
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  }
}
</script>
</body>
</html>
